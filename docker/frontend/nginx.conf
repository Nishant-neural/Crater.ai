# nginx for the frontend container. Single-page app with no router
# yet (react-router-dom is a post-gate replacement, frontend audit
# p4), so try_files falls back to index.html for any client path.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config is a plain file, never cached across deploys:
    # a stale config.js would point the UI at the wrong gateway.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
